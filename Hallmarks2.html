<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NDA Hallmarks: Two Hallways (Round 1 & 2)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
:root{
  --nda-blue:#002855;
  --nda-gold:#FFC72C;
  --bg:#0f172a;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  font-family:'Fredoka',system-ui,Segoe UI,Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  user-select:none;
}
#game-container{
  position:relative;
  width:100%;
  max-width:1100px;
  aspect-ratio:16/9;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,0.6);
}
canvas{
  width:100%;
  height:100%;
  display:block;
  image-rendering:auto;
}
#ui-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  padding:20px;
  z-index:10;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.top-hud{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.badge{
  background:rgba(255,255,255,0.95);
  color:var(--nda-blue);
  padding:10px 18px;
  border-radius:14px;
  border-left:5px solid var(--nda-gold);
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}
.badge small{
  display:block;
  text-transform:uppercase;
  letter-spacing:0.06em;
  font-weight:700;
  font-size:0.75rem;
  color:#64748b;
  margin-bottom:2px;
}
.badge h2{
  margin:0;
  font-size:1.25rem;
  font-weight:700;
}
.score{
  background:var(--nda-blue);
  color:#fff;
  border:2px solid var(--nda-gold);
  border-left:none;
}

/* --- GEM PROGRESS --- */
.gem-bar{
  display:flex;
  gap:8px;
  align-items:center;
  margin:0 8px;
}
.gem-slot{
  width:26px;
  height:26px;
  border-radius:7px;
  border:2px solid var(--nda-gold);
  background:rgba(255,255,255,0.08);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15);
  overflow:hidden;
  position:relative;
  transform:translateZ(0);
}
.gem-slot img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  opacity:0.12;
  filter:saturate(0.8) contrast(1.05);
  transform:scale(1.05);
}
.gem-slot.filled img{ opacity:1; }
.gem-slot.pulse{
  animation: gemPulse 0.55s ease-out;
}
@keyframes gemPulse{
  0%{ transform:scale(1); box-shadow:0 0 0 rgba(0,0,0,0); }
  45%{ transform:scale(1.25); box-shadow:0 0 18px rgba(255,199,44,0.55); }
  100%{ transform:scale(1); box-shadow:0 0 0 rgba(0,0,0,0); }
}
.score .line{
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:800;
}
.score .pill{
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:999px;
  padding:3px 10px;
  font-size:0.85rem;
}
.prompt{
  align-self:center;
  background:rgba(0,0,0,0.82);
  padding:10px 22px;
  border-radius:999px;
  font-size:1.05rem;
  font-weight:700;
  opacity:0;
  transform:translateY(14px);
  transition:all 0.15s ease;
}
.prompt.show{opacity:1; transform:translateY(0);}
.key{
  display:inline-block;
  background:#fff;
  color:#000;
  padding:2px 10px;
  border-radius:6px;
  font-weight:900;
  margin-right:10px;
}
#conversation-layer{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.62);
  backdrop-filter:blur(5px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
  pointer-events:auto;
  padding:24px 24px 36px;
}
#conversation-layer.active{display:flex;}
.conversation-stage{
  width:min(900px, 95%);
  display:flex;
  align-items:flex-end;
  gap:18px;
}
.big-avatar{
  width:170px; height:170px;
  border-radius:50%;
  border:5px solid #fff;
  background:#334155;
  overflow:hidden;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 14px 36px rgba(0,0,0,0.55);
  animation:slideUp .22s ease-out;
}
.big-avatar img{width:100%;height:100%;object-fit:cover;}
.big-avatar-emoji{font-size:86px;}
.speech-bubble{
  flex:1;
  background:#fff;
  color:#0f172a;
  border-radius:22px;
  border-bottom-left-radius:0;
  padding:26px 26px 18px;
  box-shadow:0 14px 48px rgba(0,0,0,0.35);
  animation:popIn .25s .05s backwards cubic-bezier(0.175,0.885,0.32,1.275);
}
.bubble-header{
  display:block;
  color:var(--nda-blue);
  text-transform:uppercase;
  font-weight:900;
  font-size:0.9rem;
  letter-spacing:0.07em;
  margin-bottom:8px;
}
.bubble-text{
  font-size:1.18rem;
  line-height:1.45;
  font-weight:700;
  margin:0 0 16px 0;
}
.hallmark-text{
  display:block;
  margin-top:10px;
  padding-left:14px;
  border-left:4px solid var(--nda-gold);
  color:var(--nda-blue);
  font-weight:900;
  font-style:italic;
}
.options-grid{display:grid; gap:10px;}
.btn{
  background:#f1f5f9;
  border:2px solid #cbd5e1;
  padding:12px 12px;
  border-radius:12px;
  font-family:inherit;
  font-size:1rem;
  font-weight:800;
  color:#334155;
  cursor:pointer;
  text-align:left;

.btn:hover{background:#e2e8f0; border-color:var(--nda-blue); color:var(--nda-blue);}
.btn.correct{background:#dcfce7; border-color:#22c55e; color:#166534;}
.btn.wrong{background:#fee2e2; border-color:#ef4444; color:#991b1b;}
.continue-btn{

#reward-overlay{

.reward-card h3{

.reward-card p{

// --- Images ---
// ===============================
// CASE-ROBUST IMAGE LOADER (Option B)
// Tries multiple filename variants so the game works on case-sensitive hosts.
// ===============================
const images = {};
const _imgTried = {}; // key -> tried list (for debugging)

function _unique(arr){
  const seen = new Set();
  const out = [];
  for (const x of arr){
    if (!x) continue;
    const k = String(x);
    if (!seen.has(k)){ seen.add(k); out.push(k); }
  }
  return out;
}

function _variantsForFilename(filename){
  if (!filename) return [];
  const f = String(filename);

  const m = f.match(/^(.*?)(\.[^.]*)$/);
  const base = m ? m[1] : f;
  const ext  = m ? m[2] : "";

  const lowerAll = (base + ext).toLowerCase();
  const lowerExt = base + ext.toLowerCase();
  const upperExt = base + ext.toUpperCase();

  const compactBase = base.replace(/[.\s_-]+/g, "");
  const compactLower = (compactBase + ext).toLowerCase();

  return _unique([f, lowerExt, upperExt, lowerAll, compactLower]);
}

function loadImgVariants(key, filenames){
  if (!key || !filenames || !filenames.length) return;
  const list = _unique(filenames.flatMap(_variantsForFilename));
  _imgTried[key] = list.slice();

  const img = new Image();
  images[key] = img;

  let idx = 0;
  const tryNext = () => {
    if (idx >= list.length){
      console.warn(`[NDA Hallmarks] Image missing for key "${key}". Tried:`, list);
      return;
    }
    const src = list[idx++];
    img.onerror = () => tryNext();
    img.src = src;
  };
  tryNext();
}

// Backward-compatible wrapper
function loadImg(key, src){
  if(!src) return;
  loadImgVariants(key, [src]);
}
// Load all requested images (case-robust)
// --- Explicit per-NPC filename variants (covers common real-world filenames) ---

// --- Helpers ---
function currentCollected(){
  return gameState.round === 1 ? gameState.collectedR1 : gameState.collectedR2;
}
function updateHUD(){
  uiLocName.innerText = LEVELS[gameState.level].name;
  uiLocType.innerText = (LEVELS[gameState.level].type === "hallway") ? "Corridor" : "Room";
  uiRoundNum.innerText = String(gameState.round);
  const n = currentCollected().size;
  gemSlots.forEach((slot, i) => slot.classList.toggle("filled", i < n));
}
function inHallway(){
  return gameState.level === (gameState.round === 1 ? "HALLWAY_A" : "HALLWAY_B");
}
function getDoors(){
  return gameState.level === "HALLWAY_A" ? DOORS_A : DOORS_B;
}

// --- Loading / Level switching ---
function switchLevel(id){
  gameState.nextLevel = id;
  gameState.transDir = 1;
}
function loadLevel(id){
  const prev = gameState.level;
  gameState.level = id;

  // Update round from level meta if hallway swap or explicit level has round
  const lvl = LEVELS[id];
  if(lvl.round) gameState.round = lvl.round;

  // Positioning rules
  if (id === "HALLWAY_A" || id === "HALLWAY_B") {
    // return from a room: spawn at door x
    if(prev && LEVELS[prev] && LEVELS[prev].type === "room"){
      const doors = (id === "HALLWAY_A") ? DOORS_A : DOORS_B;
      const door = doors.find(d => d.to === prev);
      player.x = door ? door.x : 100;
    } else {
      player.x = 100;
    }
  } else {
    player.x = 80;
  }
  cat.x = player.x - 40;

  // Shirt swap based on round
  player.shirt = (gameState.round === 2) ? "yellow" : "white";

  updateHUD();
}

// --- Prompts ---
function setPrompt(show, text){
  uiPromptText.innerText = text || "Interact";
  uiPrompt.className = show ? "prompt show" : "prompt";
}
function checkPrompts(){
  let show = false;
  let text = "";

  const lvl = LEVELS[gameState.level];
  if(lvl.type === "hallway"){
    // doors
    for(const d of getDoors()){
      if(Math.abs(player.x - d.x) < 55){
        show = true;
        text = "Enter " + d.label;
      }
    }
    // Jacobs
    if(Math.abs(player.x - jacobs.x) < 70){
      show = true;
      text = "Talk to Mr. Jacobs";
    }
  } else if (gameState.level === "ENDING"){
    if(player.x > 480 && player.x < 720){
      show = true;
      text = "Talk to St. Julie";
    }
  } else {
    // room exit
    if(player.x < 52){
      show = true;
      text = "Exit Room";
    } else {
      // talk to NPC on right side if not collected
      const qId = lvl.questId;
      const got = currentCollected().has(qId);
      if(!got && player.x > lvl.w - 220){
        show = true;
        text = "Talk to " + lvl.npc.name;
      }
    }
  }
  setPrompt(show, text);
}

// --- Interaction ---
function tryInteract(){
  if(gameState.paused) return;
  if(!uiPrompt.classList.contains("show")) return;

  const lvl = LEVELS[gameState.level];

  if(lvl.type === "hallway"){
    if(Math.abs(player.x - jacobs.x) < 70){
      const line = JACOBS_LINES[gameState.jacobsLine % JACOBS_LINES.length];
      gameState.jacobsLine++;
      launchConversation({speaker:"Mr. Jacobs", text: line, isJacobs:true});
      return;
    }
    const door = getDoors().find(d => Math.abs(player.x - d.x) < 55);
    if(door) switchLevel(door.to);
    return;
  }

  if(gameState.level === "ENDING"){
    document.getElementById("win-screen").classList.add("active");
    return;
  }

  // rooms
  if(player.x < 52){
    switchLevel(gameState.round === 1 ? "HALLWAY_A" : "HALLWAY_B");
    return;
  }

  // talk to room NPC
  const qId = lvl.questId;
  if(!currentCollected().has(qId)){
    const quest = buildQuestForRound(qId);
    launchHallmarkPhase(lvl.npc, quest);
  }
}

// Build quest: same hallmark text, slightly varied question wording in round 2 for freshness
function buildQuestForRound(qId){
  // Round 1 uses base set. Round 2 uses a DIFFERENT question + options set,
  // while keeping the SAME official 7 hallmarks.
  if(gameState.round === 1) return QUESTS_BASE[qId];
  return QUESTS_ROUND2[qId];
}

// --- Conversation system ---
function launchHallmarkPhase(npcInfo, questData){
  gameState.paused = true;
  uiConv.classList.add("active");
  uiOpts.innerHTML = "";
  uiBtn.style.display = "block";
  uiBtn.innerText = "I understand";
  uiBtn.onclick = ()=> launchQuestionPhase(questData);

  // Avatar
  const imgKey = npcInfo.type;
  const img = images[imgKey];
  if(img && img.complete && img.naturalHeight){
    uiAvatar.innerHTML = `<img src="${npcInfo.imgFile}" alt="">`;
  } else if(npcInfo.type === "student"){
    uiAvatar.innerHTML = `<div class="big-avatar-emoji">🎒</div>`;
  } else {
    uiAvatar.innerHTML = `<div class="big-avatar-emoji">${npcInfo.emoji || "👤"}</div>`;
  }

  uiName.innerText = npcInfo.name;
  uiText.innerHTML = `Before we begin, remember this Hallmark:<span class="hallmark-text">"${questData.h}"</span>`;
}

function launchQuestionPhase(questData){
  uiText.textContent = questData.q;
  uiBtn.style.display = "none";
  uiOpts.innerHTML = "";
  questData.o.forEach((opt, idx)=>{
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = opt;
    b.onclick = ()=> resolveQuestion(idx === questData.a, b, questData);
    uiOpts.appendChild(b);
  });
}

function resolveQuestion(isCorrect, btn, questData){
  Array.from(uiOpts.children).forEach(c => c.disabled = true);

  if(isCorrect){
    btn.classList.add("correct");
    uiText.innerHTML = "<span style='color:#16a34a;font-weight:900'>Correct!</span> You embody this Hallmark.";
    setTimeout(()=>{
      closeConversation();
      awardHallmark(questData.h);
    }, 700);
  } else {
    btn.classList.add("wrong");
    uiText.innerHTML = "<span style='color:#dc2626;font-weight:900'>Not quite.</span> Think about the Hallmark and try again.";
    setTimeout(()=> launchQuestionPhase(questData), 900);
  }
}

function launchConversation(data){
  gameState.paused = true;
  uiConv.classList.add("active");
  uiOpts.innerHTML = "";
  uiBtn.style.display = "block";
  uiBtn.innerText = "Continue";
  uiBtn.onclick = closeConversation;

  if(data.isJacobs && images["jacobs2"]){
    uiAvatar.innerHTML = `<img src="jacobs2.png" alt="Mr. Jacobs" onerror="this.style.display='none'">`;
  } else {
    uiAvatar.innerHTML = `<div class="big-avatar-emoji">👤</div>`;
  }
  uiName.innerText = data.speaker;
  uiText.textContent = data.text;
}

function closeConversation(){
  uiConv.classList.remove("active");
  gameState.paused = false;
}

// --- Reward + Coin flow animation to HUD ---
const coins = []; // {x,y,vx,vy,life}
function awardHallmark(hText){
  const set = currentCollected();
  const lvl = LEVELS[gameState.level];
  const qId = lvl.questId;

  // Guard
  if(set.has(qId)){
    gameState.paused = false;
    return;
  }

  set.add(qId);
  updateHUD();

  // Reward overlay content
  const n = set.size; // 1..7
  rewardTitle.textContent = `Hallmark Collected! (#${n} of 7)`;
  rewardText.textContent = hText;

  // Start coin flow (spawn near center-bottom, fly to the newly-filled gem)
  const gemTarget = getGemTarget(n-1);
  spawnCoinFlow(gemTarget.x, gemTarget.y);
  pulseGem(n-1);

  // Show reward overlay; click to continue
  gameState.paused = true;
  rewardOverlay.classList.add("active");
  rewardOverlay.onclick = ()=>{
    rewardOverlay.classList.remove("active");
    gameState.paused = false;

    // Round transitions / ending
    if(gameState.round === 1 && gameState.collectedR1.size === 7){
      // round swap: new hallway B and yellow shirt
      startRound2Transition();
    } else if(gameState.round === 2 && gameState.collectedR2.size === 7){
      switchLevel("ENDING");
    }
  };
}

function startRound2Transition(){
  // A quick modal conversation from Catective (no extra assets needed)
  launchConversation({
    speaker:"The Biblical Catective",
    text:"Case closed... for Round 1. New wing, new clues. Same 7 Hallmarks—now prove you can live them again.",
    isJacobs:false
  });

  // After user closes, move to hallway B
  const oldClose = uiBtn.onclick;
  uiBtn.onclick = ()=>{
    closeConversation();
    // swap to new hallway
    switchLevel("HALLWAY_B");
  };
}

function getScoreTarget(){
  // compute approximate target point for coin animation (top-right badge area in canvas coords)
  // The badge is not inside the canvas, but we can approximate its position in canvas space.
  // We aim near (CANVAS_W - 160, 38).
  return { x: CANVAS_W - 160, y: 42 };
}

function getGemTarget(idx){
  try{
    const slot = gemSlots[idx];
    if(!slot) return getScoreTarget();
    const slotRect = slot.getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();
    const cx = (slotRect.left + slotRect.width/2) - canvasRect.left;
    const cy = (slotRect.top + slotRect.height/2) - canvasRect.top;
    const x = (cx / canvasRect.width) * CANVAS_W;
    const y = (cy / canvasRect.height) * CANVAS_H;
    return { x, y };
  }catch(e){
    return getScoreTarget();
  }
}

function pulseGem(idx){
  const slot = gemSlots[idx];
  if(!slot) return;
  slot.classList.remove("pulse");
  // force reflow so the animation restarts reliably
  void slot.offsetWidth;
  slot.classList.add("pulse");
  setTimeout(()=>slot.classList.remove("pulse"), 650);
}

function spawnCoinFlow(tx, ty){
  // spawn ~18 coins from a source near middle-bottom
  const sx = CANVAS_W * 0.52;
  const sy = CANVAS_H * 0.72;
  for(let i=0;i<18;i++){
    const angle = (-Math.PI/2) + (Math.random()*0.9 - 0.45);
    const speed = 6 + Math.random()*3.5;
    coins.push({
      x: sx + (Math.random()*20 - 10),
      y: sy + (Math.random()*20 - 10),
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      tx, ty,
      life: 1,
      t: 0
    });
  }
}

function updateCoins(){
  // coins follow eased homing trajectory
  for(let i=coins.length-1;i>=0;i--){
    const c = coins[i];
    c.t += 0.03;
    // lerp velocity toward target
    const dx = c.tx - c.x;
    const dy = c.ty - c.y;
    const dist = Math.max(1, Math.hypot(dx,dy));
    const ax = (dx/dist) * 0.9;
    const ay = (dy/dist) * 0.9;
    c.vx = c.vx*0.88 + ax;
    c.vy = c.vy*0.88 + ay;

    c.x += c.vx;
    c.y += c.vy;

    c.life -= 0.02;
    if(dist < 18 || c.life <= 0){
      coins.splice(i,1);
    }
  }
}

function drawCoins(){
  coinCtx.clearRect(0,0,CANVAS_W,CANVAS_H);
  for(const c of coins){
    coinCtx.globalAlpha = Math.max(0, Math.min(1, c.life));
    // coin
    coinCtx.fillStyle = "#fbbf24";
    coinCtx.beginPath();
    coinCtx.arc(c.x, c.y, 6, 0, Math.PI*2);
    coinCtx.fill();
    // shine
    coinCtx.fillStyle = "rgba(255,255,255,0.7)";
    coinCtx.beginPath();
    coinCtx.arc(c.x-2, c.y-2, 2, 0, Math.PI*2);
    coinCtx.fill();
  }
  coinCtx.globalAlpha = 1;
}

// --- Game loop ---
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

function update(){
  // transitions run even when paused so the fade continues
  if(gameState.transDir !== 0){
    gameState.transition += 0.06 * gameState.transDir;
    if(gameState.transition >= 1){
      gameState.transition = 1;
      gameState.transDir = -1;
      loadLevel(gameState.nextLevel);
    } else if(gameState.transition <= 0){
      gameState.transition = 0;
      gameState.transDir = 0;
      gameState.nextLevel = null;
    }
  }

  updateCoins();

  if(gameState.paused) return;
  if(gameState.transDir !== 0) return;

  // Movement
  player.moving = false;
  if(keys.ArrowRight || keys.KeyD){ player.x += 5; player.dir = 1; player.moving = true; }
  if(keys.ArrowLeft || keys.KeyA){ player.x -= 5; player.dir = -1; player.moving = true; }

  const lvlW = LEVELS[gameState.level].w;
  player.x = Math.max(0, Math.min(lvlW - 40, player.x));

  if(player.moving) player.frame += 0.2;

  // Cat follow
  if(Math.abs(player.x - cat.x) > 60){
    cat.x += (player.x - (player.dir * 50) - cat.x) * 0.08;
  }

  // Random meow ~ every 10-15 seconds
  if(Math.random() < 0.0015){
    meowSound.play().catch(()=>{});
  }

  // Jacobs pacing in hallways
  if(LEVELS[gameState.level].type === "hallway"){
    jacobs.x += 1.5 * jacobs.dir;
    jacobs.frame += 0.1;
    if(jacobs.x > 2200) jacobs.dir = -1;
    if(jacobs.x < 200) jacobs.dir = 1;
  }

  checkPrompts();
}

function draw(){
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

  const lvl = LEVELS[gameState.level];
  const lvlW = lvl.w;

  // camera
  let camX = player.x - CANVAS_W/2;
  camX = Math.max(0, Math.min(lvlW - CANVAS_W, camX));

  ctx.save();
  ctx.translate(-camX, 0);

  // Backgrounds
  if(lvl.type === "hallway"){
    drawHallway(lvl.name, (gameState.level === "HALLWAY_A") ? "A" : "B");
    // Doors & Jacobs
    drawDoors(getDoors());
    drawJacobsSprite(jacobs.x, 390);
  } else {
    drawRoom(lvl);
    // NPC in room (unless already collected)
    if(lvl.type === "room" && gameState.level !== "ENDING"){
      if(!currentCollected().has(lvl.questId)){
        drawRoomNPC(lvl.w - 150, 410, lvl.npc);
      }
    }
    // Ending scene Julie
    if(gameState.level === "ENDING"){
      drawJulie(600, 410);
    }
  }

  // Entities
  drawCat(cat.x, cat.y);
  drawPlayer(player.x, 400);

  ctx.restore();

  // Transition fade
  if(gameState.transition > 0){
    ctx.fillStyle = `rgba(0,0,0,${gameState.transition})`;
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  }

  // coin layer
  drawCoins();
}

// --- Drawing helpers ---
function drawHallway(variant){
  const w = LEVELS[gameState.level].w;

  // Clean + consistent hallways (no strange panels)
  const wall = (variant === "A") ? "#e2e8f0" : "#e0f2fe";
  const floor = "#94a3b8";

  ctx.fillStyle = wall;  ctx.fillRect(0,0,w,540);
  ctx.fillStyle = floor; ctx.fillRect(0,400,w,140);

  // subtle trim line
  ctx.fillStyle = "rgba(15,23,42,0.08)";
  ctx.fillRect(0, 395, w, 5);
}

function drawDoors(doors){
  doors.forEach(d=>{
    ctx.fillStyle = d.color;
    ctx.fillRect(d.x-42, 178, 84, 224);
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(d.x-32, 190, 64, 200);
    // collected marker
    const qId = LEVELS[d.to].questId;
    const set = currentCollected();
    if(set.has(qId)){
      ctx.fillStyle = "#10b981";
      ctx.beginPath();
      ctx.arc(d.x, 154, 14, 0, Math.PI*2);
      ctx.fill();
    }
    // label
    ctx.fillStyle = "#0f172a";
    ctx.font = "800 14px Fredoka, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(d.label, d.x, 148);
  });
}

function drawRoom(lvl){
  const w = lvl.w;
  // base
  ctx.fillStyle = "#f8fafc";
  ctx.fillRect(0,0,w,540);
  ctx.fillStyle = "#cbd5e1";
  ctx.fillRect(0,400,w,140);

  switch(lvl.theme){
    case "chapel":
      ctx.fillStyle = "#fef3c7"; ctx.fillRect(0,0,w,540);
      // stained glass
      for(let i=140;i<w;i+=260){
        ctx.fillStyle="#0f172a"; ctx.fillRect(i-6, 60, 112, 270);
        ctx.fillStyle="#ef4444"; ctx.fillRect(i, 70, 45, 125);
        ctx.fillStyle="#3b82f6"; ctx.fillRect(i+45, 70, 55, 125);
        ctx.fillStyle="#eab308"; ctx.fillRect(i, 195, 100, 125);
      }
      ctx.fillStyle="#78350f"; ctx.fillRect(0,400,w,140);
      break;

    case "class":
      ctx.fillStyle="#e0f2fe"; ctx.fillRect(0,0,w,540);
      ctx.fillStyle="#94a3b8"; ctx.fillRect(0,400,w,140);
      // whiteboard
      ctx.fillStyle="#0f172a"; ctx.fillRect(120,90,360,170);
      ctx.fillStyle="#f8fafc"; ctx.fillRect(135,105,330,140);
      // board text
      ctx.fillStyle="#0f172a";
      ctx.font="bold 38px Fredoka, system-ui, Arial";
      ctx.textAlign="left";
      ctx.fillText("1 + 1 = 2", 185, 175);

      // posters
      for(let i=560;i<900;i+=120){
        ctx.fillStyle="rgba(15,23,42,0.18)";
        ctx.fillRect(i, 110, 90, 120);
        ctx.fillStyle="#fbbf24";
        ctx.fillRect(i+8, 118, 74, 40);
        ctx.fillStyle="#60a5fa";
        ctx.fillRect(i+8, 160, 74, 62);
      }
      break;

    case "gym":
      ctx.fillStyle="#fde68a"; ctx.fillRect(0,0,w,540);
      ctx.fillStyle="#b45309"; ctx.fillRect(0,400,w,140);
      // court lines
      ctx.strokeStyle="rgba(255,255,255,0.85)";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.rect(90, 430, 780, 70);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w/2, 465, 44, 0, Math.PI*2);
      ctx.stroke();
      // hoop
      // hoop (cleaner proportions)
      const hoopX = w - 250;
      const hoopY = 140;

      ctx.fillStyle = "#111827";

function drawPlayer(x,y){
  const bounce = Math.sin(player.frame) * 3;
  const legL = Math.sin(player.frame) * 10;
  const legR = Math.cos(player.frame) * 10;

  ctx.save();
  ctx.translate(x+20, y+40);

  // skirt
  ctx.fillStyle="#002855";
  ctx.beginPath(); ctx.moveTo(-15,10); ctx.lineTo(15,10); ctx.lineTo(20,35); ctx.lineTo(-20,35); ctx.fill();

  // legs
  ctx.fillStyle="#fca5a5";
  ctx.fillRect(-12,35,8,15); ctx.fillRect(4,35,8,15);

  // socks
  ctx.fillStyle="#fff";
  ctx.fillRect(-12,50+(player.moving?legL:0),8,10);
  ctx.fillRect(4,50+(player.moving?legR:0),8,10);

  // shoes
  ctx.fillStyle="#000";
  ctx.fillRect(-14,60+(player.moving?legL:0),12,5);
  ctx.fillRect(2,60+(player.moving?legR:0),12,5);

  // torso
  ctx.translate(0,bounce);
  ctx.fillStyle = (player.shirt === "yellow") ? "#FFC72C" : "#ffffff";
  ctx.fillRect(-15,-20,30,35);
  ctx.fillRect(-19,-20,4,15); ctx.fillRect(15,-20,4,15);

  // arms
  ctx.fillStyle="#fca5a5";
  ctx.fillRect(-19,-5,4,15); ctx.fillRect(15,-5,4,15);

  // collar
  ctx.fillStyle="#e2e8f0";
  ctx.beginPath(); ctx.moveTo(-8,-20); ctx.lineTo(8,-20); ctx.lineTo(0,-10); ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillRect(-6,-20,12,2);

  // head + hair
  ctx.fillStyle="#fca5a5";
  ctx.fillRect(-12,-38,24,20);
  ctx.fillStyle="#451a03";
  ctx.fillRect(-14,-42,28,10);
  ctx.fillRect(-14,-42,8,30);
  ctx.fillRect(6,-42,8,30);

  // eyes
  ctx.fillStyle="#000";
  if(player.dir===1){ ctx.fillRect(0,-32,2,2); ctx.fillRect(6,-32,2,2); }
  else { ctx.fillRect(-8,-32,2,2); ctx.fillRect(-2,-32,2,2); }

  ctx.restore();
}

function drawJacobsSprite(x,y){
  const img = images["jacobs"];
  if(img && img.complete && img.naturalHeight){

    // not giant: 70px tall-ish

    ctx.restore();
    // exclamation
    drawExclamation(x, y-HEAD_ANCHOR.jacobs);
  } else {
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle="#334155"; ctx.fillRect(-16,-70,32,70);

function drawRoomNPC(x,y,npcInfo){
  const type = npcInfo.type;
  if(type === "student"){
    const imgStudent = images[type];
    if(imgStudent && imgStudent.complete && imgStudent.naturalHeight){
      const bounce = Math.sin(Date.now()/600)*2;
      const targetH = 140;
      const ratio = imgStudent.naturalWidth / imgStudent.naturalHeight;
      const targetW = Math.max(70, Math.min(160, targetH * ratio));
      // anchor feet to floor line (y)
      ctx.drawImage(imgStudent, x - targetW/2, y - targetH + bounce, targetW, targetH);
      // exclamation anchored to head
      drawExclamation(x, (y - targetH) - 18 + bounce + (EXCL_TWEAK.student ?? 0));
      return;
    }
    // fallback: code-drawn student
    drawStudentNPC(x-20, y-60);
    drawExclamation(x, (y-60) - 22 + (EXCL_TWEAK.student ?? 0));
    return;
  }

  const img = images[type];
  if(img && img.complete && img.naturalHeight){
    const bounce = Math.sin(Date.now()/600)*2;
    // scale by aspect ratio but cap height to avoid squish/blurry
    const targetH = 140;
    const ratio = img.naturalWidth / img.naturalHeight;
    const targetW = Math.round(targetH * ratio);
    ctx.drawImage(img, x - targetW/2, y - targetH + bounce, targetW, targetH);

// Exclamation should sit ABOVE the character's head, anchored to the sprite top.
// (Per-NPC tweaks allow tiny adjustments for different PNG padding.)
const headTop = (y - targetH);
drawExclamation(x, headTop - 22 + bounce + (EXCL_TWEAK[type] ?? EXCL_TWEAK.default));
  } else {
    drawCodeNPC(x,y,type);
    drawExclamation(x, y - (HEAD_ANCHOR[type] || HEAD_ANCHOR.default) - 6 + (EXCL_TWEAK[type] ?? EXCL_TWEAK.default));
  }
}

function drawJulie(x, y) {
    const img = images["saint"];

        ctx.shadowColor = "rgba(255, 215, 120, 0.8)";

// --- CHEAT CODE: Hold SHIFT and press 1 twice (SHIFT+1, then 1 again) to skip to Round 2 ---
(() => {
  let cheat = "";
  let lastCheatTime = 0;

  function resetCheat() { cheat = ""; lastCheatTime = 0; }

  window.addEventListener("keydown", (e) => {
    // Must be holding Shift
    if (!e.shiftKey) { resetCheat(); return; }

    // Shift+1 often reports key "!" — use code for reliability
    const isOne = (e.code === "Digit1" || e.code === "Numpad1" || e.key === "!" || e.key === "1");
    if (!isOne) { resetCheat(); return; }

    const now = Date.now();
    if (lastCheatTime && (now - lastCheatTime) > 1200) resetCheat(); // timeout
    lastCheatTime = now;

    cheat += "1";
    if (cheat === "11") {
      resetCheat();

      try {
        // Unpause / close any overlays
        if (typeof uiConv !== "undefined" && uiConv.classList) uiConv.classList.remove("active");
        if (typeof closeConversation === "function") closeConversation();
        if (typeof gameState !== "undefined") gameState.paused = false;

        // Force Round 2 by switching to Hallway B (Hallway B carries round:2 meta)
        if (typeof switchLevel === "function") {
          switchLevel("HALLWAY_B");
        } else if (typeof loadLevel === "function") {
          loadLevel("HALLWAY_B");
        }

        if (typeof updateHUD === "function") updateHUD();
        console.log("Cheat activated: skipped to Round 2");
      } catch (err) {
        console.log("Cheat error:", err);
      }
    }
  });
})();
